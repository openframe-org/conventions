name: Lint and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: "read"

jobs:
  verify-action-pins:
    name: Verify GitHub Actions are SHA-pinned
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      attestations: "read"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinact
        run: |
          gh release download v4.1.0 -R suzuki-shunsuke/pinact -p "pinact_linux_amd64.tar.gz"
          gh attestation verify pinact_linux_amd64.tar.gz \
            -R suzuki-shunsuke/pinact \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          tar -xzf pinact_linux_amd64.tar.gz pinact
          sudo mv pinact /usr/local/bin/pinact

      - name: Check that all Actions are pinned to a SHA
        run: pinact run --fix=false

  lint:
    name: Lint and check formatting
    needs: [verify-action-pins]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

  tests:
    name: Run tests
    needs: [verify-action-pins]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test
